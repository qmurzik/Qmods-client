name: Build IPA

on:
  push:
    branches: [ "claude/anixart-ios-app" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS arm64 hosted runners are often out of capacity; try several images in parallel.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode_1[6-9]*.app 2>/dev/null | sort -V | tail -1); [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AnixQ.xcodeproj \
            -target AnixQ \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/AnixQ.app Payload/
          zip -qry AnixQ.ipa Payload
          ls -lh AnixQ.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnixQ-ipa-${{ matrix.os }}
          path: AnixQ.ipa

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AnixQ.ipa

  simulator:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: X=$(ls -d /Applications/Xcode_1[6-9]*.app 2>/dev/null | sort -V | tail -1); [ -n "$X" ] && sudo xcode-select -s "$X"
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project AnixQ.xcodeproj -target AnixQ -configuration Debug \
            -sdk iphonesimulator SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build \
            | tee sim.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" sim.log
      - name: Run and capture screenshots
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 1[5-6] Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Debug-iphonesimulator/AnixQ.app
          mkdir -p shots
          shot() { # name, args...
            name=$1; shift
            xcrun simctl terminate "$DEVICE" ru.qmods.anixq 2>/dev/null || true
            xcrun simctl launch "$DEVICE" ru.qmods.anixq "$@"
            sleep 20
            xcrun simctl io "$DEVICE" screenshot "shots/$name.png"
          }
          shot home
          shot browse -screenshotTab 1
          shot schedule -screenshotTab 2
          shot library -screenshotTab 3
          shot search -screenshotTab 4
          shot title -screenshotSlug 14421--kimetsu-no-yaiba-anime
      - name: Play episodes and rotate
        run: |
          DEVICE=$(xcrun simctl list devices booted | grep -oE "[0-9A-F-]{36}" | head -1)
          mkdir -p player
          run() { # name, args...
            name=$1; shift
            xcrun simctl terminate "$DEVICE" ru.qmods.anixq 2>/dev/null || true
            xcrun simctl launch "$DEVICE" ru.qmods.anixq -autoplaySlug 14421--kimetsu-no-yaiba-anime \
              -autoLandscapeAfter 45 -debugAutoClick YES "$@"
            for t in 10 25 40; do
              sleep 15
              xcrun simctl io "$DEVICE" screenshot "player/${name}_${t}s.png"
            done
            sleep 15
            xcrun simctl io "$DEVICE" screenshot "player/${name}_55s_landscape.png"
            sleep 15
            xcrun simctl io "$DEVICE" screenshot "player/${name}_70s_landscape.png"
            DATA=$(xcrun simctl get_app_container "$DEVICE" ru.qmods.anixq data)
            cp "$DATA/Documents/debug.log" "player/${name}.log" || true
            echo "===== $name"; cat "player/${name}.log" || true
          }
          run kodik_guest -autoplayTeam AniLibria
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-test
          path: player
