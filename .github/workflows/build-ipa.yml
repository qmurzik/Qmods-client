name: Build IPA

on:
  push:
    branches: [ "claude/anixart-ios-app" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AnixQ.xcodeproj \
            -target AnixQ \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*deprecated|BUILD" || true
          test -d build/Release-iphoneos/AnixQ.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/AnixQ.app Payload/
          zip -qry AnixQ.ipa Payload
          ls -lh AnixQ.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnixQ-ipa
          path: AnixQ.ipa

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AnixQ.ipa

  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project AnixQ.xcodeproj -target AnixQ -configuration Debug \
            -sdk iphonesimulator -arch arm64 SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build \
            | grep -E "error:|BUILD" || true
          test -d build/Debug-iphonesimulator/AnixQ.app
      - name: Run and capture screenshots
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 1[5-6] Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Debug-iphonesimulator/AnixQ.app
          mkdir -p shots
          shot() { # name, args...
            name=$1; shift
            xcrun simctl terminate "$DEVICE" ru.qmods.anixq 2>/dev/null || true
            xcrun simctl launch "$DEVICE" ru.qmods.anixq "$@"
            sleep 20
            xcrun simctl io "$DEVICE" screenshot "shots/$name.png"
          }
          shot home
          shot catalog -screenshotTab 1
          shot search -screenshotTab 2
          shot schedule -screenshotTab 3
          shot release -screenshotRelease 20024
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots

  player-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project AnixQ.xcodeproj -target AnixQ -configuration Debug \
            -sdk iphonesimulator -arch arm64 SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build \
            | grep -E "error:|BUILD" || true
          test -d build/Debug-iphonesimulator/AnixQ.app
      - name: Play episodes and rotate
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 1[5-6] Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Debug-iphonesimulator/AnixQ.app
          mkdir -p player
          run() { # name, args...
            name=$1; shift
            xcrun simctl terminate "$DEVICE" ru.qmods.anixq 2>/dev/null || true
            xcrun simctl launch "$DEVICE" ru.qmods.anixq -autoplayRelease 2804 -autoplayType 2 \
              -autoLandscapeAfter 45 -debugAutoClick YES "$@"
            for t in 10 25 40; do
              sleep 15
              xcrun simctl io "$DEVICE" screenshot "player/${name}_${t}s.png"
            done
            sleep 15
            xcrun simctl io "$DEVICE" screenshot "player/${name}_55s_landscape.png"
            sleep 15
            xcrun simctl io "$DEVICE" screenshot "player/${name}_70s_landscape.png"
            DATA=$(xcrun simctl get_app_container "$DEVICE" ru.qmods.anixq data)
            cp "$DATA/Documents/debug.log" "player/${name}.log" || true
            echo "===== $name"; cat "player/${name}.log" || true
          }
          run libria -autoplaySource Libria
          run kodik_adblock -autoplaySource Kodik
          run kodik_noadblock -autoplaySource Kodik -adblock NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-test
          path: player
