name: Build IPA

on:
  push:
    branches: [ "claude/anixart-ios-app" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS arm64 hosted runners are often out of capacity; try several images in parallel.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode_1[6-9]*.app 2>/dev/null | sort -V | tail -1); [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AnixQ.xcodeproj \
            -target AnixQ \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/AnixQ.app Payload/
          zip -qry AnixQ.ipa Payload
          ls -lh AnixQ.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnixQ-ipa-${{ matrix.os }}
          path: AnixQ.ipa

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  release:
    # Publishes the IPA as a GitHub release and refreshes the GBox source on branch gbox-source.
    needs: build
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: AnixQ-ipa-*
          path: dl
      - name: Pick IPA
        run: |
          IPA=$(find dl -name AnixQ.ipa -size +100k | head -1)
          test -n "$IPA"
          cp "$IPA" AnixQ.ipa
          echo "IPA_SIZE=$(stat -c%s AnixQ.ipa)" >> "$GITHUB_ENV"
          echo "VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Release notes
        run: git log -1 --pretty=%B | grep -v -E "^(Co-Authored-By|Claude-Session):" > notes.txt
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AnixQ ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: notes.txt
          files: AnixQ.ipa
          make_latest: true
      - name: Update GBox source
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          BASE="https://raw.githubusercontent.com/$REPO/gbox-source"
          python3 scripts/gbox_source.py gbox.json "$VERSION" \
            "https://github.com/$REPO/releases/download/v$VERSION/AnixQ.ipa" \
            "$BASE/icon.png" "$IPA_SIZE" "$(cat notes.txt)"
          mkdir src && cd src
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:$TOKEN@github.com/$REPO.git"
          if git fetch -q origin gbox-source; then git checkout -q -b gbox-source FETCH_HEAD; else git checkout -q --orphan gbox-source; fi
          cp ../gbox.json gbox.json
          cp ../AnixQ/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png icon.png
          printf '# AnixQ — источник GBox\n\nДобавьте в GBox источник:\n\n    %s/gbox.json\n' "$BASE" > README.md
          git add -A
          git commit -q -m "AnixQ $VERSION" || exit 0
          git push -q origin gbox-source

